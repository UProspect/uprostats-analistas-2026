<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UProstats · Hub Analítico Mundial 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0D1B3E;--navy2:#162048;--navy3:#1E2D5A;--navy4:#263570;
  --orange:#E8461A;--orange2:#FF5A2C;--orange3:#FF7A50;
  --gold:#c9851a;--gold2:#e09a20;
  --bg:#F0F2F7;--surface:#FFFFFF;--card:#F7F8FC;--card2:#EEF0F8;
  --text:#0D1B3E;--text2:#3A4A6B;--muted:#6B7A9E;
  --border:#DDE2F0;--border2:#C8D0E8;
  --green:#1a7a3c;--green2:#22a050;
  --blue:#1B5FC0;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}

/* ═══════════════════════════════════════
   HEADER
═══════════════════════════════════════ */
.header{
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);
  border-bottom:1px solid var(--border2);
  padding:0 24px;height:64px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.header::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--orange),transparent);
  opacity:.4;
}
.header-left{display:flex;align-items:center;gap:14px}

/* Logo completo */
.logo-full{height:34px;width:auto;display:block;filter:brightness(1.05)}

.header-center{
  font-family:'Oswald',sans-serif;font-size:11px;font-weight:500;
  letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.35);
  display:none;
}
@media(min-width:600px){.header-center{display:block}}

.partido-sel-wrap{display:flex;align-items:center;gap:8px}
.sel-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
select.partido-sel{
  background:rgba(255,255,255,.15);color:#fff;
  border:1px solid rgba(255,255,255,.3);border-radius:8px;
  padding:6px 12px;font-size:12px;font-family:'DM Sans',sans-serif;
  cursor:pointer;outline:none;max-width:200px;
}

/* ═══════════════════════════════════════
   MATCH CARD
═══════════════════════════════════════ */
.match-card{
  background:linear-gradient(135deg,var(--navy2) 0%,var(--navy3) 100%);
  border:1px solid var(--border2);border-radius:16px;
  padding:20px 28px;margin-bottom:16px;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;
  position:relative;overflow:hidden;
}
.match-card::before{
  content:'';position:absolute;top:-30px;left:50%;transform:translateX(-50%);
  width:200px;height:200px;background:var(--orange);opacity:.03;border-radius:50%;
}
.team-name{
  font-family:'Oswald',sans-serif;font-size:22px;font-weight:600;
  color:var(--text);letter-spacing:.02em;
}
.team-l{text-align:left}.team-r{text-align:right}
.team-meta{font-size:11px;color:var(--muted);margin-top:4px}
.score-wrap{text-align:center}
.score{
  font-family:'Bebas Neue',sans-serif;font-size:56px;color:var(--orange);
  letter-spacing:6px;line-height:1;display:block;
}
.match-meta{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:4px}
.jornada-badge{
  display:inline-block;background:var(--orange);color:#fff;
  font-family:'Oswald',sans-serif;font-size:10px;font-weight:500;
  letter-spacing:.1em;padding:2px 8px;border-radius:4px;margin-right:6px;
}

/* ═══════════════════════════════════════
   MAIN TABS — dos niveles
═══════════════════════════════════════ */
.main-tabs{
  display:flex;gap:0;background:var(--navy);
  border:1px solid var(--navy2);border-radius:12px;
  margin-bottom:12px;overflow:hidden;
}
.main-tab{
  flex:1;padding:13px 16px;border:none;background:transparent;
  color:rgba(255,255,255,.45);font-family:'Oswald',sans-serif;
  font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
  cursor:pointer;transition:all .2s;border-right:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.main-tab:last-child{border-right:none}
.main-tab{border-right-color:rgba(255,255,255,.1)}
.main-tab.active{background:var(--orange);color:#fff}
.main-tab:hover:not(.active){background:rgba(255,255,255,.08);color:rgba(255,255,255,.7)}
.main-tab.locked{opacity:.4;cursor:not-allowed}
.lock-icon{font-size:11px;opacity:.7}

/* Sub-tabs dentro de "Partido por Partido" */
.sub-tabs{
  display:flex;gap:4px;background:var(--card2);
  border:1px solid var(--border);border-radius:10px;
  padding:4px;margin-bottom:14px;
}
.sub-tab{
  flex:1;padding:8px 10px;border:none;background:transparent;
  color:var(--muted);font-family:'Oswald',sans-serif;
  font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;
  cursor:pointer;border-radius:7px;transition:all .18s;
}
.sub-tab.active{background:var(--navy);color:#fff;border:1px solid var(--navy2)}
.sub-tab:hover:not(.active){background:var(--border);color:var(--text)}

.panel{display:none}.panel.active{display:block}

/* ═══════════════════════════════════════
   SECTION LABEL
═══════════════════════════════════════ */
.slabel{
  font-family:'Oswald',sans-serif;font-size:10px;font-weight:500;
  letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
  margin:16px 0 8px;display:flex;align-items:center;gap:8px;
}
.slabel::after{content:'';flex:1;height:1px;background:var(--border)}

/* ═══════════════════════════════════════
   PLAYER GRID
═══════════════════════════════════════ */
.player-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
@media(min-width:500px){.player-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:800px){.player-grid{grid-template-columns:repeat(6,1fr)}}

.pcard{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:12px;cursor:pointer;transition:all .15s;
}
.pcard:hover{border-color:var(--navy4);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.4)}
.pcard.sel{border-color:var(--orange);border-width:1.5px;background:rgba(232,70,26,.06)}
.pcard.sel::before{content:'';display:block;height:2px;background:var(--orange);border-radius:2px;margin:-12px -12px 10px}
.ppos{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.pname{font-family:'Oswald',sans-serif;font-size:15px;font-weight:500;color:var(--text);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pteam{font-size:10px;color:var(--muted);margin-bottom:8px}
.pnota{font-family:'Bebas Neue',sans-serif;font-size:36px;line-height:1}
.pnota-lbl{font-size:9px;color:var(--muted);margin-top:1px;font-family:'Oswald',sans-serif;letter-spacing:.1em}
.minibar-row{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--muted);margin-top:5px}
.minibar-track{flex:1;height:2px;background:var(--border2);border-radius:2px;overflow:hidden}
.minibar-fill{height:100%;border-radius:2px;transition:width .5s}

/* ═══════════════════════════════════════
   DETAIL CARD
═══════════════════════════════════════ */
.detail-card{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:20px;margin-bottom:12px}
.detail-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.detail-name{font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--text);letter-spacing:.03em;line-height:1}
.detail-sub{font-size:11px;color:var(--muted);margin-top:4px}
.detail-nota{font-family:'Bebas Neue',sans-serif;font-size:64px;line-height:1}
.nota-lbl{font-size:10px;color:var(--muted);text-align:right;font-family:'Oswald',sans-serif;letter-spacing:.1em;text-transform:uppercase}

.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px}
.sbox{background:var(--card);border-radius:10px;padding:10px;text-align:center;border:1px solid var(--border)}
.sval{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--text)}
.slbl2{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:2px;font-family:'Oswald',sans-serif}

.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px}
.bar-lbl{width:120px;color:var(--muted);text-align:right;flex-shrink:0;font-size:11px}
.bar-track{flex:1;height:6px;background:var(--card2);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .6s}
.bar-val{width:32px;text-align:right;font-weight:600;font-size:11px;font-family:'Oswald',sans-serif}

.divider{height:1px;background:var(--border);margin:14px 0}
.tag{display:inline-block;padding:3px 10px;border-radius:4px;font-size:10px;font-weight:600;margin:2px;font-family:'Oswald',sans-serif;letter-spacing:.04em}
.tag-g{background:rgba(0,196,122,.15);color:var(--green2)}
.tag-r{background:rgba(239,83,80,.15);color:#FF6B6B}
.tag-o{background:rgba(232,70,26,.15);color:var(--orange3)}

/* ═══════════════════════════════════════
   11 IDEAL — JORNADA
═══════════════════════════════════════ */
.round-btns{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.rbtn{
  padding:5px 13px;border:1px solid var(--border2);background:transparent;
  color:var(--muted);border-radius:20px;font-size:11px;font-weight:500;
  cursor:pointer;font-family:'Oswald',sans-serif;letter-spacing:.04em;
  text-transform:uppercase;transition:all .15s;
}
.rbtn.active{background:var(--orange);color:#fff;border-color:var(--orange)}
.rbtn:hover:not(.active){background:var(--card2);color:var(--text2)}
.rbtn.locked{opacity:.35;cursor:not-allowed}

.plist{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px}
.pitem{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.pitem:last-child{border-bottom:none}
.pitem:hover{background:var(--card)}
.pitem.on{background:#EEF3FF}
.pcheck{width:17px;height:17px;border-radius:4px;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;color:#fff;font-weight:700;transition:all .15s}
.pcheck.on{background:var(--blue);border-color:var(--blue)}
.pitem-name{font-family:'Oswald',sans-serif;font-size:13px;font-weight:500;color:var(--text)}
.pitem-meta{font-size:10px;color:var(--muted)}
.pitem-count{font-size:10px;color:var(--blue);margin-left:auto;font-weight:600}

.info-bar{background:var(--navy);border:1px solid var(--navy2);border-radius:10px;padding:10px 16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.istat{text-align:center}
.ival{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fff}
.ilbl{font-size:9px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.08em;margin-top:1px;font-family:'Oswald',sans-serif}

.form-btns{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.fbtn{
  padding:5px 13px;border:1px solid var(--border2);background:transparent;
  color:var(--text2);border-radius:20px;font-size:12px;font-weight:500;
  cursor:pointer;font-family:'Oswald',sans-serif;letter-spacing:.04em;
  text-transform:uppercase;transition:all .15s;
}
.fbtn:hover:not(.active){background:var(--card2)}
.fbtn.active{background:var(--orange);color:#fff;border-color:var(--orange)}

/* PITCH */
.pitch-wrap{
  background:linear-gradient(180deg,#0C3B1A 0%,#0F4A20 50%,#0C3B1A 100%);
  border-radius:14px;padding:18px 12px;margin-bottom:12px;
  border:1px solid #1a6030;position:relative;overflow:hidden;
}
.pitch-wrap::before{
  content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:120px;height:120px;border:1px solid rgba(255,255,255,.06);border-radius:50%;
}
.pitch-wrap::after{
  content:'';position:absolute;top:50%;left:0;right:0;height:1px;
  background:rgba(255,255,255,.05);
}
.pitch-row{display:flex;justify-content:space-around;align-items:center;padding:6px 0;position:relative;z-index:1}
.pp{text-align:center;min-width:56px}
.pav{
  width:40px;height:40px;border-radius:50%;
  background:var(--navy3);border:2px solid rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;color:#fff;
  margin:0 auto 3px;transition:all .2s;cursor:pointer;
}
.pav:hover{transform:scale(1.12);border-color:rgba(255,255,255,.5)}
.pav.gk{background:#0D2E6E;border-color:rgba(59,143,255,.5)}
.pav.ov{border-color:var(--orange);background:rgba(232,70,26,.3)}
.ppname{font-size:9px;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56px;margin:0 auto;font-family:'DM Sans',sans-serif}
.ppnota{font-family:'Bebas Neue',sans-serif;font-size:12px;color:var(--gold);margin-top:1px}
.ppteam{font-size:8px;color:rgba(255,255,255,.35);margin-top:1px}

.leg-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:10px}
@media(min-width:700px){.leg-grid{grid-template-columns:repeat(3,1fr)}}
.leg-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px;display:flex;align-items:center;gap:8px}
.leg-badge{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:9px;font-weight:600;color:#fff;flex-shrink:0}
.leg-name{font-family:'Oswald',sans-serif;font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg-sub{font-size:9px;color:var(--muted)}
.leg-nota{font-family:'Bebas Neue',sans-serif;font-size:20px;margin-left:auto;flex-shrink:0}

.acc-btn{width:100%;display:flex;align-items:center;justify-content:space-between;background:transparent;border:none;color:var(--muted);font-family:'Oswald',sans-serif;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:8px 0;margin-bottom:6px}
.acc-body{display:none}.acc-body.open{display:block}
.ov-panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px}
.ov-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
.ov-row:last-child{margin-bottom:0}
.ov-pos{width:36px;font-family:'Oswald',sans-serif;font-size:10px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ov-input{flex:1;background:var(--card);border:1px solid var(--border2);border-radius:6px;padding:5px 10px;color:var(--text);font-size:11px;font-family:'DM Sans',sans-serif;outline:none}
.ov-input:focus{border-color:var(--orange)}
.ov-nota{width:32px;text-align:right;font-family:'Bebas Neue',sans-serif;font-size:16px}

/* ═══════════════════════════════════════
   ANÁLISIS
═══════════════════════════════════════ */
.an-header{text-align:center;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.an-label{font-family:'Oswald',sans-serif;font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--orange);margin-bottom:6px}
.an-title-main{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--text);letter-spacing:.03em}

.an-block{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px;border-left:3px solid var(--orange);display:flex;gap:12px;align-items:flex-start}
.an-block.defensive{border-left-color:var(--blue)}
.an-block.figura{border-left-color:var(--gold)}
.an-block.preview{border-left-color:var(--green)}
.an-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.an-icon.offensive{background:rgba(232,70,26,.15)}
.an-icon.defensive{background:rgba(59,143,255,.15)}
.an-icon.figura{background:rgba(245,200,66,.1)}
.an-icon.preview{background:rgba(0,196,122,.1)}
.an-content{flex:1}
.an-cat{font-family:'Oswald',sans-serif;font-size:9px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px}
.an-cat.offensive{color:var(--orange3)}
.an-cat.defensive{color:var(--blue)}
.an-cat.figura{color:var(--gold)}
.an-cat.preview{color:var(--green2)}
.an-title{font-family:'Oswald',sans-serif;font-size:17px;font-weight:600;color:var(--text);margin-bottom:5px;line-height:1.2}
.an-text{font-size:12px;color:var(--muted);line-height:1.7}
.an-stat{font-family:'Oswald',sans-serif;font-size:12px;font-weight:500;margin-top:8px;letter-spacing:.03em}
.an-stat.offensive{color:var(--orange)}
.an-stat.defensive{color:var(--blue)}
.an-stat.figura{color:var(--gold)}
.an-stat.preview{color:var(--green)}

/* ═══════════════════════════════════════
   MODAL
═══════════════════════════════════════ */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal-box{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:24px;max-width:560px;width:90%;max-height:80vh;overflow-y:auto}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--text);margin-bottom:4px;letter-spacing:.03em}
.modal-sub{font-size:11px;color:var(--muted);margin-bottom:14px}
.modal-content{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:12px;line-height:1.8;color:var(--text);white-space:pre-wrap;margin-bottom:14px;font-family:'DM Sans',sans-serif}
.modal-btns{display:flex;gap:8px}
.modal-copy{flex:1;padding:10px;background:var(--orange);color:#fff;border:none;border-radius:8px;font-family:'Oswald',sans-serif;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:background .2s}
.modal-copy:hover{background:var(--orange2)}
.modal-close{padding:10px 16px;background:var(--card2);color:var(--muted);border:1px solid var(--border);border-radius:8px;font-family:'Oswald',sans-serif;font-size:13px;cursor:pointer}

/* ═══════════════════════════════════════
   EXPORT BUTTONS
═══════════════════════════════════════ */
.export-btn{
  width:100%;padding:12px;border:none;border-radius:10px;
  font-family:'Oswald',sans-serif;font-size:13px;font-weight:500;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
  margin-top:8px;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.export-btn.orange{background:var(--orange);color:#fff}
.export-btn.orange:hover{background:var(--orange2);transform:translateY(-1px)}
.export-btn.ghost{background:transparent;border:1.5px solid var(--border2);color:var(--text2)}
.export-btn.ghost:hover{background:var(--card);border-color:var(--navy4);color:var(--text)}

/* ═══════════════════════════════════════
   ESTADO VACÍO JORNADA
═══════════════════════════════════════ */
.empty-jornada{
  text-align:center;padding:48px 24px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;margin:16px 0;
}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:.4}
.empty-title{font-family:'Oswald',sans-serif;font-size:18px;font-weight:500;color:var(--text2);margin-bottom:6px}
.empty-sub{font-size:12px;color:var(--muted)}

/* ═══════════════════════════════════════
   POWERED
═══════════════════════════════════════ */

/* PARTIDO SELECTOR PANEL */
.partido-sel-panel{
  background:var(--navy);border-radius:12px;padding:14px 18px;
  margin-bottom:14px;display:flex;align-items:center;gap:12px;
}
.partido-sel-inner{display:flex;align-items:center;gap:10px;width:100%}
.sel-label-dark{font-family:'Oswald',sans-serif;font-size:10px;font-weight:500;

function buildOncePartido(form){
  const jugs=DB.partidos[curP].jugadores;
  const slots=FORMS[form].flat();
  const used=new Set(),eqC={},res=[];
  slots.forEach((slot,i)=>{
    const k=slot.trim();
    const vp=POS_MAP[k]||[k];
    const cands=jugs.filter(p=>vp.includes(p.pos)&&!used.has(p.id)).sort((a,b)=>b.nota-a.nota);
    if(cands.length>0){
      res.push({...cands[0],slot:k});
      used.add(cands[0].id);
    } else {
      res.push({nombre:"—",equipo:"",nota:0,slot:k,pos:k,id:"_"+i});
    }
  });
  return res;
}

        <div class="pav ${isGK?"gk":""}" title="${p.nombre}">${ini}</div>
        <div class="ppname">${p.nombre.split(" ")[0]}</div>
        <div class="ppnota">${p.nota>0?p.nota.toFixed(1):""}</div>
        <div class="ppteam">${p.equipo||""}</div>
      </div>`;
    }).join("")}</div>`;
  }).join("");
  document.getElementById("legenda-partido").innerHTML=once.map(p=>`
  <div class="leg-item">
    <div class="leg-badge" style="background:${p.slot==="GK"?"#0D2E6E":"var(--navy3)"}">${p.slot}</div>
    <div style="flex:1;min-width:0">
      <div class="leg-name">${p.nombre}</div>
      <div class="leg-sub">${p.equipo}</div>
    </div>
    <div class="leg-nota" style="color:${rc(p.nota)}">${p.nota>0?p.nota.toFixed(1):"—"}</div>
  </div>`).join("");
}

function setFormPartido(f,btn){
  curFormPartido=f;
  document.querySelectorAll("#form-btns-partido .fbtn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  renderXIPartido();
}

// ── XI IDEAL POR JORNADA ──────────────────────────
function getAllPlayers(){
  const pool={};
  DB.partidos.forEach((p,i)=>{
    if(!selParts.has(i))return;
    p.jugadores.forEach(j=>{
      const k=j.nombre+"_"+j.equipo;
      if(!pool[k]||pool[k].nota<j.nota)pool[k]={...j};
    });
  });
  return Object.values(pool);
}

function buildOnce(){
  const slots=FORMS[curForm].flat();
  const players=getAllPlayers();
  const used=new Set(),eqC={},res=[];
  slots.forEach((slot,i)=>{
    const k=slot.trim();
    if(overrides[i]){
      res.push({...overrides[i],override:true,slot:k});
      used.add(overrides[i].nombre+"_"+overrides[i].equipo);
      eqC[overrides[i].equipo]=(eqC[overrides[i].equipo]||0)+1;
      return;
    }
    const vp=POS_MAP[k]||[k];
    const cands=players.filter(p=>vp.includes(p.pos)&&!used.has(p.nombre+"_"+p.equipo)&&(eqC[p.equipo]||0)<2).sort((a,b)=>b.nota-a.nota);
    if(cands.length>0){
      const pk=cands[0];
      res.push({...pk,override:false,slot:k});
      used.add(pk.nombre+"_"+pk.equipo);
      eqC[pk.equipo]=(eqC[pk.equipo]||0)+1;
    } else {
      res.push({nombre:"—",equipo:"",pos:k,nota:0,override:false,slot:k});
    }
  });
  return res;
}

function selectRound(r,btn){
  if(btn.classList.contains("locked"))return;
  curRound=r;overrides={};
  document.querySelectorAll(".rbtn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  selParts=new Set(DB.rondas[r].partidos);
  renderPList();renderOnceAll();
}

function togglePart(i){
  if(selParts.has(i))selParts.delete(i);else selParts.add(i);
  overrides={};renderPList();renderOnceAll();
}

function renderPList(){
  const r=DB.rondas[curRound];
  const toShow=r.partidos.length>0?r.partidos:DB.partidos.map((_,i)=>i);
  document.getElementById("pcount").textContent=`(${selParts.size} de ${toShow.length})`;
  document.getElementById("plist").innerHTML=toShow.map(i=>{
    const p=DB.partidos[i];const on=selParts.has(i);
    return`<div class="pitem ${on?"on":""}" onclick="togglePart(${i})">
      <div class="pcheck ${on?"on":""}">${on?"✓":""}</div>
      <div><div class="pitem-name">${p.nombre}</div><div class="pitem-meta">${p.jornada}</div></div>
      <div class="pitem-count">${p.jugadores.length} jugadores</div>
    </div>`;
  }).join("")||`<div style="padding:16px;text-align:center;color:var(--muted);font-size:13px">Sin partidos en esta fase todavía</div>`;
}

function renderOnceAll(){
  if(selParts.size===0){
    document.getElementById("pitch").innerHTML=`<div style="text-align:center;padding:24px;color:rgba(255,255,255,.3);font-size:13px">Selecciona al menos un partido</div>`;
    document.getElementById("legenda").innerHTML="";
    document.getElementById("ibar").innerHTML="";
    return;
  }
  const once=buildOnce();
  const filas=FORMS[curForm];
  let idx=0;
  document.getElementById("pitch").innerHTML=filas.map((fila,ri)=>{
    const isGK=ri===0;
    return`<div class="pitch-row">${fila.map(()=>{
      const p=once[idx++]||{nombre:"—",nota:0,override:false,equipo:""};
      const ini=p.nombre.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
      return`<div class="pp">
        <div class="pav ${isGK?"gk":""} ${p.override?"ov":""}" title="${p.nombre}">${ini}</div>
        <div class="ppname">${p.nombre.split(" ")[0]}</div>
        <div class="ppnota">${p.nota>0?p.nota.toFixed(1):""}</div>
        <div class="ppteam">${p.equipo||""}</div>
      </div>`;
    }).join("")}</div>`;
  }).join("");

  document.getElementById("legenda").innerHTML=once.map(p=>`
  <div class="leg-item">
    <div class="leg-badge" style="background:${p.override?"var(--orange)":p.slot==="GK"?"#0D2E6E":"var(--navy3)"}">${p.slot}</div>
    <div style="flex:1;min-width:0">
      <div class="leg-name">${p.nombre}</div>
      <div class="leg-sub">${p.equipo}${p.override?` · <span style="color:var(--orange)">override</span>`:""}</div>
    </div>
    <div class="leg-nota" style="color:${rc(p.nota)}">${p.nota>0?p.nota.toFixed(1):"—"}</div>
  </div>`).join("");

  const players=getAllPlayers();
  const avg=players.length>0?players.reduce((s,p)=>s+p.nota,0)/players.length:0;
  document.getElementById("ibar").innerHTML=`
    <div class="istat"><div class="ival">${players.length}</div><div class="ilbl">Jugadores</div></div>
    <div class="istat"><div class="ival">${new Set(players.map(p=>p.equipo)).size}</div><div class="ilbl">Equipos</div></div>
    <div class="istat"><div class="ival">${selParts.size}</div><div class="ilbl">Partidos</div></div>
    <div class="istat"><div class="ival" style="color:${rc(avg)}">${avg.toFixed(1)}</div><div class="ilbl">Nota media</div></div>`;

  renderOvPanel(once);
}

function renderOvPanel(once){
  document.getElementById("ov-panel").innerHTML=once.map((p,i)=>`
  <div class="ov-row">
    <div class="ov-pos">${p.slot}</div>
    <input class="ov-input" placeholder="${p.nombre}" value="${overrides[i]?overrides[i].nombre:""}" onchange="setOv(${i},this.value,'${p.slot}')"/>
    <div class="ov-nota" style="color:${rc(p.nota)}">${p.nota>0?p.nota.toFixed(1):"—"}</div>
  </div>`).join("");
}

function setOv(i,n,pos){
  if(!n.trim()){delete overrides[i];}
  else{
    const pl=getAllPlayers().find(p=>p.nombre.toLowerCase().includes(n.toLowerCase()));
    overrides[i]=pl?{...pl,pos}:{nombre:n.trim(),equipo:"Override",pos,nota:0,so:0,sd:0};
  }
  renderOnceAll();
}

function setForm(f,btn){
  curForm=f;overrides={};
  document.querySelectorAll("#jornada-content .form-btns .fbtn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  renderOnceAll();
}

function toggleAcc(){
  const b=document.getElementById("acc-body"),ic=document.getElementById("acc-icon");
  b.classList.toggle("open");
  ic.style.transform=b.classList.contains("open")?"rotate(180deg)":"";
}

  document.getElementById("analisis-wrap").innerHTML=`
  <div class="an-block">

      <div class="an-stat defensive">SD ${topDF.nombre}: ${topDF.sd.toFixed(1)} · Duelos: ${topDF.duelos}%</div>
    </div>

      <div class="an-text">${mvp.nombre} (${mvp.equipo} · ${mvp.pos}). ${mvp.toques_area>10?mvp.toques_area+" toques en campo rival. ":""}${mvp.xG!==null&&mvp.goles>mvp.xG?"Superó su xG de "+mvp.xG.toFixed(2)+". ":""}${mvp.regates>=5?mvp.regates+" regates completados. ":""}</div>
      <div class="an-stat figura">Rating: ${mvp.nota.toFixed(1)}/10 · SO ${mvp.so.toFixed(1)} · SD ${mvp.sd.toFixed(1)}</div>
    </div>
  </div>
  <div class="an-block preview">
    <div class="an-icon preview">👁</div>
    <div class="an-content">
      <div class="an-cat preview">Lo que viene</div>

      <div class="an-stat preview">xG: ${p.xgL} vs ${p.xgV} · Dif: ${Math.abs(p.xgL-p.xgV).toFixed(2)}</div>

// ── NAVEGACIÓN ──────────────────────────
function showMainTab(id){
  document.querySelectorAll(".main-tab").forEach((t,i)=>t.classList.toggle("active",["partido","jornada"][i]===id));
  document.getElementById("panel-partido").classList.toggle("active",id==="partido");
  document.getElementById("panel-jornada").classList.toggle("active",id==="jornada");
  if(id==="jornada"){renderPList();renderOnceAll();}
}

function showSubTab(id){
  document.querySelectorAll(".sub-tab").forEach((t,i)=>t.classList.toggle("active",["jugador","analisis","xi-partido"][i]===id));
  document.getElementById("sub-jugador").classList.toggle("active",id==="jugador");
  document.getElementById("sub-analisis").classList.toggle("active",id==="analisis");
  document.getElementById("sub-xi-partido").classList.toggle("active",id==="xi-partido");
  if(id==="analisis")renderAnalisis();
  if(id==="xi-partido")renderXIPartido();
}

  document.getElementById("modal-title").textContent=title;
  document.getElementById("modal-sub").textContent=sub;
  document.getElementById("modal-content").textContent=content;
  document.getElementById("modal").classList.add("open");
}
function closeModal(e){if(e.target===document.getElementById("modal"))document.getElementById("modal").classList.remove("open");}
function copyModal(){
  const text=document.getElementById("modal-content").textContent;
  navigator.clipboard.writeText(text).then(()=>{
    const btn=document.querySelector(".modal-copy");
    btn.textContent="✅ Copiado";
    setTimeout(()=>btn.textContent="📋 Copiar texto",2000);
  });
}

function exportOnce(){

  const lista=once.map(p=>`${p.slot}: ${p.nombre} (${p.equipo}) — ${p.nota>0?p.nota.toFixed(1):"—"}`).join("\n");

    `XI DEL PARTIDO — ${p.nombre.toUpperCase()}\nFormación: ${curFormPartido}\n\n${lista}\n\n#Mundial2026 #UProstats`);

document.addEventListener("DOMContentLoaded",function(){
  renderMatchHdr();
  renderPGrid();
  renderPList();
  document.getElementById("partido-sel").addEventListener("change",function(){
    curP=parseInt(this.value);curSel=0;
    renderMatchHdr();renderPGrid();

      const idx=[...document.querySelectorAll(".sub-tab")].indexOf(activeSub);
      if(idx===1)renderAnalisis();
      if(idx===2)renderXIPartido();
    }
  });
});
